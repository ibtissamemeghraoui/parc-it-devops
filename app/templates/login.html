{% extends "base.html" %}
{% block titre %}Connexion – Parc IT{% endblock %}
{% block contenu %}
<section class="carte formcarte">
  <h1>Connexion</h1>
  {% if erreur %}<p class="avis erreur" role="alert" style="margin-top:1rem">{{ erreur }}</p>{% endif %}
  <form method="post" style="margin-top:1rem">
    <div class="champs">
      <label>Nom d'utilisateur<input name="nom_utilisateur" required autofocus autocomplete="username"></label>
      <label>Mot de passe<input type="password" name="mot_de_passe" required autocomplete="current-password"></label>
    </div>
    <div class="boutons"><button class="btn" type="submit">Se connecter</button></div>
  </form>
</section>
{% endblock %}
