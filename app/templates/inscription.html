{% extends "base.html" %}
{% block titre %}Créer un compte – Parc IT{% endblock %}
{% block contenu %}
<section class="carte formcarte">
  <h1>Créer un compte</h1>
  <p class="doux" style="margin:.5rem 0 0">Un nouveau compte peut consulter l'inventaire. Seul un administrateur peut le modifier.</p>
  {% if erreur %}<p class="avis erreur" role="alert" style="margin-top:1rem">{{ erreur }}</p>{% endif %}
  <form method="post" style="margin-top:1rem">
    <div class="champs">
      <label>Nom d'utilisateur<input name="nom_utilisateur" value="{{ nom }}" required autofocus minlength="3" maxlength="30" autocomplete="username"></label>
      <label>Mot de passe (8 caractères minimum)<input type="password" name="mot_de_passe" required minlength="8" autocomplete="new-password"></label>
      <label>Confirmer le mot de passe<input type="password" name="confirmation" required minlength="8" autocomplete="new-password"></label>
    </div>
    <div class="boutons">
      <button class="btn" type="submit">Créer mon compte</button>
      <a class="btn neutre" href="{{ url_for('login') }}">J'ai déjà un compte</a>
    </div>
  </form>
</section>
{% endblock %}
