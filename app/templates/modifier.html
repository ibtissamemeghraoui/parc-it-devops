{% extends "base.html" %}
{% block titre %}Modifier {{ e.nom }} – Parc IT{% endblock %}
{% block contenu %}
<section class="carte formcarte">
  <h1>Modifier l'équipement</h1>
  <form method="post" action="{{ url_for('modifier', eq_id=e.id) }}">
    <div class="champs">
      <label>Nom<input name="nom" value="{{ e.nom }}" required maxlength="100"></label>
      <label>Type<input name="type" value="{{ e.type }}" required maxlength="50"></label>
      <label>Numéro de série<input name="numero_serie" value="{{ e.numero_serie }}" required maxlength="100"></label>
      <label>Statut
        <select name="statut">
          {% for s in statuts %}<option {% if s == e.statut %}selected{% endif %}>{{ s }}</option>{% endfor %}
        </select>
      </label>
      <label>Affectation<input name="affectation" value="{{ e.affectation or '' }}" maxlength="100"></label>
    </div>
    <div class="boutons">
      <button class="btn" type="submit">Enregistrer les modifications</button>
      <a class="btn neutre" href="{{ url_for('index') }}">Annuler</a>
    </div>
  </form>
</section>
{% endblock %}
