name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  tests:
    name: Tests pytest
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            app/requirements.txt
            app/requirements-dev.txt

      - name: Installer les dépendances
        run: pip install -r app/requirements-dev.txt

      - name: Lancer les tests
        working-directory: app
        run: pytest -v

  docker:
    name: Image Docker
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Construire l'image
        run: docker build -f docker/Dockerfile -t parc-it:ci .

      - name: Test de fumée du conteneur
        run: |
          docker run -d -p 5000:5000 --name parc-it parc-it:ci
          sleep 8
          curl --fail http://localhost:5000/health
          docker logs parc-it
      - name: Analyse de sécurité (Trivy)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 parc-it:ci
