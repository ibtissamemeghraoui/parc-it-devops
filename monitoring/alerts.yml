groups:
  - name: parc-it
    rules:
      - alert: ApplicationHorsLigne
        expr: up{job="parc-it-app"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "L'application parc-it ne répond plus"
          description: "Prometheus n'arrive plus à lire les métriques de l'application depuis plus de 30 secondes."

      - alert: ErreursServeur
        expr: sum(rate(flask_http_request_total{status=~"5.."}[1m])) > 0
        for: 15s
        labels:
          severity: warning
        annotations:
          summary: "Des erreurs serveur (5xx) sont renvoyées"
          description: "L'application renvoie des réponses de la famille 5xx."

      - alert: TempsDeReponseEleve
        expr: sum(rate(flask_http_request_duration_seconds_sum[1m])) / sum(rate(flask_http_request_duration_seconds_count[1m])) > 0.5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Le temps de réponse moyen dépasse 0,5 seconde"
          description: "Le temps de réponse moyen est supérieur à 0,5 s depuis plus de 2 minutes."